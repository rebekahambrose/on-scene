# The bot. Pull all sources, aggregate, publish live.json to the "data" branch.
# Every 30 minutes while the repo is private: each run bills at least 1 minute and
# private repos get 2,000 free minutes a month. Set to "*/5 * * * *" if the repo goes public.
name: Collect live data

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collectors
        run: python collect.py
      - name: Publish to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site/data
          git init -q -b data
          git add live.json
          git -c user.name="on-scene-bot" -c user.email="on-scene-bot@users.noreply.github.com" commit -q -m "Live data"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
