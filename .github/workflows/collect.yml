# The bot. Every 5 minutes: pull all sources, aggregate, publish live.json to the "data" branch.
# Public repos run Actions free. If the repo goes private again, slow this to "7,37 * * * *"
# (every 30 minutes) to stay inside the 2,000 free private minutes a month.
name: Collect live data

on:
  schedule:
    # Offset from the busy :00/:05 marks, which GitHub often delays or drops.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Get the last published data (for trails and history)
        run: |
          mkdir -p site/data/previous
          if git fetch -q --depth=1 origin data; then
            git show origin/data:live.json > site/data/previous/live.json || true
            git show origin/data:history.json > site/data/previous/history.json || true
          fi
      - name: Run collectors
        run: python collect.py
      - name: Publish to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site/data
          rm -rf previous
          git init -q -b data
          git add live.json history.json
          git -c user.name="on-scene-bot" -c user.email="on-scene-bot@users.noreply.github.com" commit -q -m "Live data"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
